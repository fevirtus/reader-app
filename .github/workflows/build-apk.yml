name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nhãn GitHub Release, ví dụ v1.0.3.10 (có thể để trống)"
        required: false
      build_number:
        description: "Chỉ nhập SỐ NGUYÊN, ví dụ 11; không nhập v1.0.3.10. Để trống để dùng pubspec.yaml"
        required: false
        type: string

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://reader-api.fevirtus.dev' }}
      INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.workers.max=2"
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      RELEASE_TAG: ""
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_ANDROID_SHA1: ${{ secrets.EXPECTED_ANDROID_SHA1 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release tag input
        run: |
          RESOLVED_TAG=""

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_RELEASE_TAG:-}" ]; then
            RESOLVED_TAG="${INPUT_RELEASE_TAG}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            RESOLVED_TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [ -n "$RESOLVED_TAG" ] && [[ ! "$RESOLVED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::release_tag must be a version such as v1.0.3"
            exit 1
          fi
          if [ -n "$INPUT_BUILD_NUMBER" ] && [[ ! "$INPUT_BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::build_number must be an integer such as 11, NOT a version tag such as v1.0.3.10. Leave it empty to use pubspec.yaml."
            exit 1
          fi
          if [ -n "$INPUT_BUILD_NUMBER" ] && [ "$INPUT_BUILD_NUMBER" -gt 2100000000 ]; then
            echo "::error::build_number exceeds Google Play's limit"
            exit 1
          fi

          echo "RELEASE_TAG=${RESOLVED_TAG}" >> "$GITHUB_ENV"
          echo "Resolved RELEASE_TAG=${RESOLVED_TAG:-<empty>}"
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.5"
          cache: true

      - name: Prepare preinstalled Android SDK
        run: |
          # ubuntu-24.04 already includes the SDK; do not replace its command-line tools.
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          # Capture sdkmanager's exit code, not yes's expected SIGPIPE (141).
          set +e
          yes | "$SDKMANAGER" --licenses > /tmp/android-licenses.log 2>&1
          LICENSE_EXIT=${PIPESTATUS[1]}
          set -e
          if [ "$LICENSE_EXIT" -ne 0 ]; then
            cat /tmp/android-licenses.log
            exit "$LICENSE_EXIT"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
          flutter config --android-sdk "$ANDROID_HOME"

      - name: Show Flutter and Dart version
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare Android release signing
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            echo "Preparing release keystore from secrets"

            if ! python3 -c "import base64,os,re,sys; s=os.environ.get('ANDROID_KEYSTORE_BASE64',''); s=s.strip().strip(chr(34)).strip(chr(39)); s=s.replace('\\n',''); s=re.sub(r'^data:[^,]*,','',s); s=re.sub(r'\\s+','',s); s=s + ('=' * (-len(s) % 4)); (print('ANDROID_KEYSTORE_BASE64 is empty after normalization'), sys.exit(1)) if not s else None; d=base64.b64decode(s, validate=False); open('android/app/release.keystore','wb').write(d); print('Decoded keystore bytes:', len(d))"
            then
              echo "Keystore decoding failed"
              exit 1
            fi

            if [ ! -s android/app/release.keystore ]; then
              echo "Decoded keystore file is empty"
              exit 1
            fi

            if ! keytool -list -keystore android/app/release.keystore -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1; then
              echo "Decoded keystore is invalid or ANDROID_KEYSTORE_PASSWORD is incorrect"
              exit 1
            fi

            RESOLVED_KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            if [ -z "$RESOLVED_KEY_ALIAS" ]; then
              RESOLVED_KEY_ALIAS=$(keytool -list -v -keystore android/app/release.keystore -storepass:env ANDROID_KEYSTORE_PASSWORD | awk -F': ' '/Alias name:/{print $2; exit}')
            fi

            if [ -z "$RESOLVED_KEY_ALIAS" ]; then
              echo "Could not resolve key alias from keystore"
              exit 1
            fi

            if ! keytool -list -keystore android/app/release.keystore -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$RESOLVED_KEY_ALIAS" >/dev/null 2>&1; then
              echo "Configured key alias does not exist in keystore: $RESOLVED_KEY_ALIAS"
              keytool -list -v -keystore android/app/release.keystore -storepass:env ANDROID_KEYSTORE_PASSWORD | sed -n 's/^Alias name: /Available alias: /p'
              exit 1
            fi

            echo "Using keystore alias: $RESOLVED_KEY_ALIAS"

            export RESOLVED_KEY_ALIAS
            python3 scripts/write_android_signing.py
          else
            echo "Release signing secrets are required for tagged release builds."
            echo "Please configure: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD"
            echo "Optional: ANDROID_KEY_ALIAS (auto-detected if omitted)"
            exit 1
          fi

      - name: Build release APK
        run: |
          BASE_URL_VALUE="$BASE_URL"
          if [[ "$BASE_URL_VALUE" != https://* ]]; then
            echo "::error::Release BASE_URL must use HTTPS"
            exit 1
          fi

          FLUTTER_CMD=(
            # Regenerate the release plugin registrant after pub get (which includes test plugins).
            flutter build apk --release
            "--dart-define=BASE_URL=${BASE_URL_VALUE}"
          )

          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            FLUTTER_CMD+=("--build-number=$INPUT_BUILD_NUMBER")
          fi

          if [ -n "${GOOGLE_SERVER_CLIENT_ID}" ]; then
            FLUTTER_CMD+=("--dart-define=GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID}")
          fi

          if [ -n "${GOOGLE_CLIENT_ID}" ]; then
            FLUTTER_CMD+=("--dart-define=GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}")
          fi

          "${FLUTTER_CMD[@]}"

      - name: Verify APK signing certificate
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER_PATH="${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi

          if [ ! -x "$APKSIGNER_PATH" ]; then
            echo "apksigner not found at $APKSIGNER_PATH"
            exit 1
          fi

          CERT_OUTPUT="$($APKSIGNER_PATH verify --print-certs "$APK_PATH")"
          echo "$CERT_OUTPUT"
          if echo "$CERT_OUTPUT" | grep -q 'CN=Android Debug'; then
            echo "::error::Release artifact was signed with an Android debug key"
            exit 1
          fi

          if [ -n "${EXPECTED_ANDROID_SHA1}" ]; then
            APK_SHA1=$(echo "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n1)
            APK_SHA1_NORMALIZED=$(echo "$APK_SHA1" | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')
            EXPECTED_SHA1_NORMALIZED=$(echo "${EXPECTED_ANDROID_SHA1}" | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')

            if [ "$APK_SHA1_NORMALIZED" != "$EXPECTED_SHA1_NORMALIZED" ]; then
              echo "APK SHA-1 mismatch"
              echo "Expected (normalized): $EXPECTED_SHA1_NORMALIZED"
              echo "Actual   (normalized): $APK_SHA1_NORMALIZED"
              echo "Check the expected certificate against the intended upload key"
              exit 1
            fi
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-app-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Rename APK for release
        if: env.RELEASE_TAG != ''
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "reader-app-${RELEASE_TAG}.apk"

      - name: Create GitHub release and upload APK
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: reader-app-${{ env.RELEASE_TAG }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/release.keystore
